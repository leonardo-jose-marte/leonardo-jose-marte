name: Update YouTube Videos
on:
    schedule:
        - cron: "0 * * * *" # Se ejecuta cada hora
    workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Pull Latest YouTube Videos
              uses: gautamkrishnar/blog-post-workflow@master
              with:
                  comment_tag_name: "YOUTUBE"
                  feed_list: "https://www.youtube.com/feeds/videos.xml?user=datacode-dev"
