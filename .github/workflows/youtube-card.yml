name: Update YouTube Videos

on:
    schedule:
        - cron: "0 */6 * * *"
    workflow_dispatch:

jobs:
    update-readme-with-youtube:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Pull YouTube Videos
              uses: gautamkrishnar/blog-post-workflow@master
              with:
                  comment_tag_name: "YOUTUBE-VIDEOS"
                  feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCvD_sU02jU7J3_W-K4d6g5Q"
                  max_post_count: 8
                  template: "| [<img src='$neuro_image' width='200'/><br/>**$title**]($url) |"
