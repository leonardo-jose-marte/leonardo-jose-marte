name: Update README YouTube Videos

# Refreshes the "Latest YouTube Videos" block in README.md with the latest
# uploads of the configured channel. The block is regenerated by a Python
# script and only committed when it actually changed.

on:
  schedule:
    # Weekly, Saturdays at 17:00 local time.
    # The repository author runs on SA Western Standard Time (UTC-4, no
    # daylight saving), so 17:00 local is 21:00 UTC year-round.
    # The minute is 0 on purpose: the run is meant to land exactly on 5 PM.
    # GitHub's scheduler can drop queued jobs at the top of the hour when
    # the load is high. A dropped run is not lost: the next Saturday picks
    # it up, and `workflow_dispatch` can trigger it by hand.
    - cron: '0 21 * * 6'
  workflow_dispatch:

concurrency:
  # Serializes runs of this workflow so two schedules never overlap.
  group: update-readme-youtube-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      # Required to push the regenerated README back to this repository.
      # Without it GITHUB_TOKEN is read-only on contents for new personal
      # repositories and the push fails.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A full history is needed so that `git pull --rebase` can fold in a
          # manual edit made while this job was running. The default shallow
          # clone refuses to rebase.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Update README
        env:
          # Public channel id. Override with a repository variable to change
          # channels without touching this file.
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCeJfqKpQiBVbrLBUvk-pMFg' }}
          YOUTUBE_VIDEO_COUNT: '6'
          # Optional. When unset the script falls back to the YouTube RSS feed,
          # which needs no key but cannot provide duration or Shorts filtering.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python .github/scripts/update_videos.py

      - name: Commit
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update latest YouTube videos"
          # Re-sync in case the author pushed a manual README edit while
          # this job was running; without it the push would be rejected as
          # non-fast-forward and the run would be lost.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
